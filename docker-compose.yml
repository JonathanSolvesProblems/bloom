# Lives at ~/experimental-projects/bloom/docker-compose.yml on the OVH box.
#
# Bloom is a Next.js standalone server. It receives inbound HTTPS, so unlike
# loose-ends it joins the shared `web` network and is routed by the box's
# existing Traefik (entrypoint websecure, certresolver le, HTTP-01).
#
# Postgres is Neon, not a container here. The only state on this box is the image.
#
# Built from ./app, which is shipped from a local checkout rather than pulled
# here: the repo is private, and a shared box is the wrong place for a credential
# that can read it. See the deploy section of README.md for the exact commands.
# The previous tree is kept beside it as ./app.prev, which is the rollback.
services:
  app:
    build:
      context: ./app
      args:
        # Baked in at build time: NEXT_PUBLIC_* is inlined into the client bundle,
        # so passing it only at runtime would leave the browser with an empty value.
        NEXT_PUBLIC_APP_URL: https://bloom.jonathanandrei.com
    container_name: bloom
    env_file: .env
    restart: unless-stopped
    networks:
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.bloom.rule: Host(`bloom.jonathanandrei.com`)
      traefik.http.routers.bloom.entrypoints: websecure
      traefik.http.routers.bloom.tls.certresolver: le
      traefik.http.services.bloom.loadbalancer.server.port: "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The weekly agent has no Vercel Cron here, so a sidecar wakes it up. It only
  # holds the shared secret and calls the dispatcher endpoint; all the real work
  # (fan-out, stagger, generation, delivery) stays in the app. It addresses the
  # app as `bloom`, the container name, because `web` is shared with every other
  # stack on this box and the alias `app` is not unique there.
  #
  # Ticks DAILY at 13:00 UTC, not just Monday. The run is idempotent (content is
  # keyed @@unique([businessId, weekOf]) and the send is claimed atomically), and
  # the dispatcher skips any business already done for the week, so a daily tick
  # is a no-op for finished businesses but lets a business that missed its Monday
  # run (a deploy or crash during the tick) self-heal the same week instead of
  # silently losing it. It also means a business that signs up mid-week gets its
  # first content that day rather than waiting for the next Monday.
  cron:
    image: alpine:3.20
    container_name: bloom-cron
    restart: unless-stopped
    env_file: .env
    depends_on:
      - app
    networks:
      - web
    volumes:
      - ./app/ops/weekly-tick.sh:/weekly-tick.sh:ro
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             printenv CRON_SECRET > /run/cron-secret && chmod 600 /run/cron-secret &&
             echo '0 13 * * * sh /weekly-tick.sh >> /var/log/bloom-cron.log 2>&1' > /etc/crontabs/root &&
             touch /var/log/bloom-cron.log &&
             crond -f -l 8"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  web:
    external: true
